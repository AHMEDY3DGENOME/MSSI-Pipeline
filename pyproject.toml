[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mssi-pipeline"
version = "1.0.0"
description = "Multi-HSP Stress Signature Index Pipeline for Fall Armyworm stress biology"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.9"

authors = [
    {name = "Ahmed Yassin", email = "Ahmedyassin300@outlook.com"}
]

keywords = [
    "bioinformatics",
    "entomology",
    "heat shock proteins",
    "sHsp",
    "stress index",
    "Spodoptera frugiperda",
    "fall armyworm",
    "qRT-PCR",
    "gene expression",
    "insecticide resistance"
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "fpdf2>=2.7",
    "openpyxl>=3.1",
    "customtkinter>=5.2",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "black",
    "flake8",
]

[project.scripts]
mssi = "MSSI_Pipeline.cli:main"

[project.urls]
Homepage = "https://github.com/AHMEDY3DGENOME/MSSI-Pipeline"
Repository = "https://github.com/AHMEDY3DGENOME/MSSI-Pipeline.git"
Issues = "https://github.com/AHMEDY3DGENOME/MSSI-Pipeline/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["MSSI_Pipeline*", "gui*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"*" = [
    "assets/*",
    "assets/**/*"
]

[tool.pytest.ini_options]
testpaths = ["tests"]